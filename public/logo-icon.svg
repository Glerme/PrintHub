<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="white"/>

  <!-- PRINTER FRAME -->
  <rect x="28" y="18" width="200" height="188"
        rx="20" ry="20"
        fill="none" stroke="#1a1a1a" stroke-width="17"
        stroke-linejoin="round"/>

  <!-- NOZZLE mount -->
  <rect x="109" y="4" width="38" height="22" rx="5" fill="#1a1a1a"/>
  <!-- NOZZLE body -->
  <rect x="119" y="24" width="18" height="24" rx="3" fill="#1a1a1a"/>
  <!-- NOZZLE tip -->
  <polygon points="119,48 137,48 128,64" fill="#1a1a1a"/>

  <!-- FILAMENT LINE -->
  <line x1="128" y1="64" x2="128" y2="80"
        stroke="#F47B20" stroke-width="5" stroke-linecap="round"/>

  <!-- ISOMETRIC CUBE -->
  <!-- Top face -->
  <polygon points="128,80 176,108 128,136 80,108" fill="#F47B20"/>
  <!-- Right face -->
  <polygon points="176,108 176,164 128,192 128,136" fill="#C45D0E"/>
  <!-- Left face -->
  <polygon points="128,136 128,192 80,164 80,108" fill="#E06A16"/>

  <!-- HUB NODES -->
  <line x1="80" y1="108" x2="46" y2="89"
        stroke="#F47B20" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="40" cy="86" r="7" fill="#F47B20" opacity="0.85"/>

  <line x1="176" y1="108" x2="210" y2="89"
        stroke="#F47B20" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="216" cy="86" r="7" fill="#F47B20" opacity="0.85"/>

  <line x1="128" y1="192" x2="128" y2="201"
        stroke="#F47B20" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="128" cy="204" r="5" fill="#F47B20" opacity="0.85"/>
</svg>
