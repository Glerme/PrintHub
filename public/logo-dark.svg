<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <!-- PRINTER FRAME (white for dark bg) -->
  <rect x="148" y="22" width="204" height="192"
        rx="20" ry="20"
        fill="none" stroke="white" stroke-width="17"
        stroke-linejoin="round"/>

  <!-- NOZZLE -->
  <rect x="232" y="6" width="36" height="22" rx="5" fill="white"/>
  <rect x="241" y="26" width="18" height="26" rx="3" fill="white"/>
  <polygon points="241,52 259,52 250,70" fill="white"/>

  <!-- FILAMENT LINE -->
  <line x1="250" y1="70" x2="250" y2="87"
        stroke="#F47B20" stroke-width="5" stroke-linecap="round"/>

  <!-- ISOMETRIC CUBE -->
  <polygon points="250,87 298,115 250,143 202,115" fill="#F47B20"/>
  <polygon points="298,115 298,170 250,198 250,143" fill="#C45D0E"/>
  <polygon points="250,143 250,198 202,170 202,115" fill="#E06A16"/>

  <!-- HUB SPOKES -->
  <line x1="202" y1="115" x2="166" y2="97"
        stroke="#F47B20" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="160" cy="94" r="7" fill="#F47B20" opacity="0.85"/>

  <line x1="298" y1="115" x2="334" y2="97"
        stroke="#F47B20" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="340" cy="94" r="7" fill="#F47B20" opacity="0.85"/>

  <line x1="250" y1="198" x2="250" y2="206"
        stroke="#F47B20" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="250" cy="208" r="5" fill="#F47B20" opacity="0.85"/>

  <!-- LOGOTYPE -->
  <text y="302"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="76"
        text-anchor="middle"
        letter-spacing="2">
    <tspan x="250" fill="white">PRINT </tspan><tspan fill="#F47B20">HUB</tspan>
  </text>
</svg>
